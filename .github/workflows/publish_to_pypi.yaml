name: Publish package to PyPI

on:
  push:
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  test_ubuntu:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install Poetry
      uses: abatilo/actions-poetry@v3
      with:
        poetry-version: "2.1.2"
    
    - name: Install dependencies
      run: poetry install

    # - name: Run tests
    #   run: poetry run pytest


  test_windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Poetry
        uses: abatilo/actions-poetry@v3
        with:
          poetry-version: "2.1.2"

      - name: Install dependencies
        run: poetry install
        
      # - name: Run tests
      #   run: poetry run pytest

  build:

    needs: [test_ubuntu, test_windows]
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install Poetry
      uses: abatilo/actions-poetry@v3
      with:
        poetry-version: "2.1.2"

    - name: Build distributions
      run: poetry build --no-interaction

    - name: Upload distributions
      uses: actions/upload-artifact@v7
      with:
        name: python-distributions
        path: dist/
        if-no-files-found: error

  publish_to_pypi:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/turbodash-core
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist/

      - name: Check publishing credentials
        env:
          PYPI_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
        run: |
          if [ -z "$PYPI_PASSWORD" ]; then
            echo "::error::Set the repository secret PYPI_PASSWORD to the project's PyPI API token."
            exit 1
          fi

      - name: Publish to PyPI with existing credentials
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: ${{ secrets.PYPI_USERNAME || '__token__' }}
          password: ${{ secrets.PYPI_PASSWORD }}
          attestations: false
