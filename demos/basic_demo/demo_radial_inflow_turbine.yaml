# Geometry inputs use true-chord solidity c/s.
inputs:
  loss_model: benner
  fluid_name: Air
  turbine_type: radial
  inlet_property_pair: PT_INPUTS
  inlet_property_1: 500000
  inlet_property_2: 600
  exit_pressure: 100000
  mass_flow_rate: 10
  inlet_flow_angle: 0
  blade_velocity_ratio: 0.6
  rotational_speed:
    type: specific
    value: 0.7
  stages:
  - name: stage_1
    work_fraction_split: 1
    stator_exit_angle: 70
    degree_reaction: 0.5
    meridional_velocity_ratio_12: 1
    meridional_velocity_ratio_23: 1
    meridional_velocity_ratio_34: 1
    radius_ratio_01: 1
    radius_ratio_12: 1.1
    radius_ratio_23: 1.05
    radius_ratio_34: 1.2
    blade_geometry:
      stator:
        maximum_thickness_to_chord: 0.3
        aspect_ratio: 2.0
        maximum_thickness_location: 0.3
        leading_edge_radius_to_max_thickness: 0.5
        trailing_edge_thickness_to_opening: 0.07
        trailing_edge_wedge_angle: 5.0
        leading_edge_wedge_angle: 30.0
        solidity_chord: 1.1209982569657782
      rotor:
        maximum_thickness_to_chord: 0.3
        aspect_ratio: 2.0
        maximum_thickness_location: 0.3
        leading_edge_radius_to_max_thickness: 0.5
        trailing_edge_thickness_to_opening: 0.07
        trailing_edge_wedge_angle: 5.0
        leading_edge_wedge_angle: 30.0
        solidity_chord: 1.216757241009723
  # Assumed exhaust recovery: 0 gives total-to-static, 1 total-to-total.
  diffuser:
    kinetic_energy_recovery_fraction: 0.60
