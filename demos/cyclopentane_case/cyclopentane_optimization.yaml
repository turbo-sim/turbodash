# Pure-impulse axial turbine optimization: maximize total-to-static efficiency.
# Starts from the unoptimized tenth design. Load this file directly in the app.
# Fixed: reaction = 0; stator/rotor aspect ratio = 2; all thickness/shape inputs.
# Axial radius ratios stay at 1; the single-stage work weight stays at 1.
# Vary all remaining effective axial design variables, including both solidities.
# Equalities: zero flaring AND outlet hub/tip = 0.90 in EACH row.
# With constant axial mean radius and zero flaring, inlet hub/tip is also 0.90.
# Constraint scales are residual divisors, not targets or allowed tolerances.
inputs:
  loss_model: benner
  fluid_name: Cyclopentane
  turbine_type: axial
  inlet_property_pair: PQ_INPUTS
  inlet_property_1: 251300.00
  inlet_property_2: 0.09155
  exit_pressure: 94400.00
  mass_flow_rate: 126.95
  inlet_flow_angle: 0.00
  blade_velocity_ratio: 0.50
  rotational_speed: 0.58
  stages:
  - name: stage_1
    work_fraction_split: 1.00
    stator_exit_angle: 70.00
    degree_reaction: 0.00
    meridional_velocity_ratio_12: 0.169
    meridional_velocity_ratio_23: 1.00
    meridional_velocity_ratio_34: 1.00
    radius_ratio_01: 1.00
    radius_ratio_12: 1.00
    radius_ratio_23: 1.00
    radius_ratio_34: 1.00
    blade_geometry:
      stator:
        aspect_ratio: 2.00
        maximum_thickness_to_chord: 0.30
        maximum_thickness_location: 0.30
        leading_edge_radius_to_max_thickness: 0.50
        trailing_edge_thickness_to_opening: 0.07
        trailing_edge_wedge_angle: 5.00
        leading_edge_wedge_angle: 5.00
        solidity_chord: 1.1209982569657784
      rotor:
        aspect_ratio: 2.00
        maximum_thickness_to_chord: 0.30
        maximum_thickness_location: 0.50
        leading_edge_radius_to_max_thickness: 0.05
        trailing_edge_thickness_to_opening: 0.07
        trailing_edge_wedge_angle: 5.00
        leading_edge_wedge_angle: 5.00
        solidity_chord: 2.1539034913192463
  # Assumed exhaust recovery: 0 gives total-to-static, 1 total-to-total.
  diffuser:
    kinetic_energy_recovery_fraction: 0.60

  rotational_speed_type: specific
optimization:
  design_variables:
    blade_velocity_ratio:
      lower_value: 0.25
      upper_value: 1.00
    rotational_speed:
      lower_value: 0.20
      upper_value: 1.50
    stages.0.stator_exit_angle:
      lower_value: 50.00
      upper_value: 80.00
    stages.0.meridional_velocity_ratio_12:
      lower_value: 0.01
      upper_value: 2.00
    stages.0.meridional_velocity_ratio_23:
      lower_value: 0.01
      upper_value: 2.00
    stages.0.meridional_velocity_ratio_34:
      lower_value: 0.01
      upper_value: 2.00
    stages.0.blade_geometry.stator.solidity_chord:
      lower_value: 0.50
      upper_value: 3.00
    stages.0.blade_geometry.rotor.solidity_chord:
      lower_value: 0.50
      upper_value: 3.00
  objective_function:
    variable: $overall_performance.efficiency_ts
    type: maximize
  constraints:
  - variable: $stages_performance.*.geometry_meanline.*.flaring_angle
    type: '='
    value: 0.00
    normalize: 10.00
  - variable: $stages_performance.*.geometry_meanline.*.hub_tip_ratio_out
    type: '='
    value: 0.90
    normalize: 1.00
  feasibility_tolerance: 1.00e-06
  solver_options:
    ftol: 1.00e-09
    maxiter: 200
    finite_diff_step: 1.00e-07
    first_step_fraction: 0.25
    max_step_fraction: 1.00
    step_growth_factor: 1.50
    domain_backtracking: true
    backtrack_factor: 0.50
    max_backtracks: 20
    optimality_tol: 0.0001
