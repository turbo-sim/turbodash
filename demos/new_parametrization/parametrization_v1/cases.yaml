# Thickness and edge radii are ratios to meridional chord; x_max_fraction is meridional.
# Wedges are half-angles: 0 is the sharp-wedge limit (radius still rounds the tip),
# 90 is an explicit flat face with constant body on that side.
# Camberline dimensions are in metres; all angles are in degrees.
cases:
  impulse:
    title: Symmetric impulse-like blade
    camberline:
      coordinates: cartesian
      camberline_type: angle
      metal_angle_in_deg: 55.0
      metal_angle_out_deg: -55.0
      chord_meridional: 0.01
      turning_location: 0.5
      turning_concentration: 1.0
    thickness:
      leading_edge_wedge_angle_deg: 9.0
      trailing_edge_wedge_angle_deg: 9.0
      maximum_thickness_ratio: 0.2
      x_max_fraction: 0.5
      leading_edge_radius_ratio: 0.025
      trailing_edge_radius_ratio: 0.025
  reaction:
    title: Asymmetric reaction-like blade
    camberline:
      coordinates: cartesian
      camberline_type: angle
      metal_angle_in_deg: 0.0
      metal_angle_out_deg: 65.0
      chord_meridional: 0.01
      turning_location: 0.5
      turning_concentration: 1.0
    thickness:
      leading_edge_wedge_angle_deg: 21.0
      trailing_edge_wedge_angle_deg: 7.0
      maximum_thickness_ratio: 0.25
      x_max_fraction: 0.3
      leading_edge_radius_ratio: 0.04
      trailing_edge_radius_ratio: 0.006
  straight_constant:
    title: Straight blade with constant body thickness
    camberline:
      coordinates: cartesian
      camberline_type: angle
      metal_angle_in_deg: 0.0
      metal_angle_out_deg: 0.0
      chord_meridional: 0.012
      turning_location: 0.5
      turning_concentration: 1.0
    thickness:
      leading_edge_wedge_angle_deg: 0.0
      trailing_edge_wedge_angle_deg: 0.0
      maximum_thickness_ratio: 0.08333333
      x_max_fraction: 0.5
      leading_edge_radius_ratio: 0.02083333
      trailing_edge_radius_ratio: 0.02083333
  radial_constant:
    title: Radial blade with constant normal body thickness
    camberline:
      coordinates: radial
      camberline_type: angle
      radius_in: 0.02
      radius_out: 0.035
      metal_angle_in_deg: 10.0
      metal_angle_out_deg: 55.0
      turning_location: 0.5
      turning_concentration: 1.0
    thickness:
      leading_edge_wedge_angle_deg: 0.0
      trailing_edge_wedge_angle_deg: 0.0
      maximum_thickness_ratio: 0.06666667
      x_max_fraction: 0.5
      leading_edge_radius_ratio: 0.01666667
      trailing_edge_radius_ratio: 0.008
  broad_maximum:
    title: Blade with a flat maximum
    camberline:
      coordinates: cartesian
      camberline_type: angle
      metal_angle_in_deg: 35.0
      metal_angle_out_deg: -45.0
      chord_meridional: 0.012
      turning_location: 0.5
      turning_concentration: 1.6
    thickness:
      leading_edge_wedge_angle_deg: 11.0
      trailing_edge_wedge_angle_deg: 6.0
      plateau_fraction: 0.3
      maximum_thickness_ratio: 0.16666667
      x_max_fraction: 0.45
      leading_edge_radius_ratio: 0.025
      trailing_edge_radius_ratio: 0.0125
  flat_ends:
    title: Flat-ended constant-thickness blade
    camberline:
      coordinates: cartesian
      camberline_type: angle
      metal_angle_in_deg: 0.0
      metal_angle_out_deg: 0.0
      chord_meridional: 0.012
      turning_location: 0.5
      turning_concentration: 1.0
    thickness:
      leading_edge_wedge_angle_deg: 90.0
      trailing_edge_wedge_angle_deg: 90.0
      maximum_thickness_ratio: 0.08333333
      x_max_fraction: 0.5
      leading_edge_radius_ratio: 0.02083333
      trailing_edge_radius_ratio: 0.02083333
