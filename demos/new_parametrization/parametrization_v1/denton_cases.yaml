# Thicknesses are full normal thickness / meridional chord before edge rounding.
# x_max_fraction is the nominal body station; the actual maximum can differ.
# Edge blend lengths are fractions of meridional chord. Zero gives a flat end.
cases:
  impulse:
    title: Impulse-like blade
    camberline:
      coordinates: cartesian
      camberline_type: angle
      metal_angle_in_deg: 55.0
      metal_angle_out_deg: -55.0
      chord_meridional: 0.01
    thickness:
      maximum_thickness_ratio: 0.2
      x_max_fraction: 0.5
      leading_edge_thickness_ratio: 0.05
      trailing_edge_thickness_ratio: 0.05
      leading_edge_fraction: 0.08
      trailing_edge_fraction: 0.08
  reaction:
    title: Reaction-like blade
    camberline:
      coordinates: cartesian
      camberline_type: angle
      metal_angle_in_deg: 0.0
      metal_angle_out_deg: 65.0
      chord_meridional: 0.01
    thickness:
      maximum_thickness_ratio: 0.25
      x_max_fraction: 0.3
      leading_edge_thickness_ratio: 0.08
      trailing_edge_thickness_ratio: 0.02
      leading_edge_fraction: 0.1
      trailing_edge_fraction: 0.025
  straight_constant:
    title: Straight constant-thickness body
    camberline:
      coordinates: cartesian
      metal_angle_in_deg: 0.0
      metal_angle_out_deg: 0.0
      chord_meridional: 0.012
    thickness:
      maximum_thickness_ratio: 0.08333333
      leading_edge_thickness_ratio: 0.08333333
      trailing_edge_thickness_ratio: 0.08333333
      leading_edge_fraction: 0.10
      trailing_edge_fraction: 0.10
  radial_constant:
    title: Radial constant-thickness body
    camberline:
      coordinates: radial
      metal_angle_in_deg: 10.0
      metal_angle_out_deg: 55.0
      radius_in: 0.02
      radius_out: 0.035
    thickness:
      maximum_thickness_ratio: 0.06666667
      leading_edge_thickness_ratio: 0.06666667
      trailing_edge_thickness_ratio: 0.06666667
      leading_edge_fraction: 0.10
      trailing_edge_fraction: 0.08
  broad_maximum:
    title: Broad Denton thickness hump
    camberline:
      coordinates: cartesian
      metal_angle_in_deg: 35.0
      metal_angle_out_deg: -45.0
      chord_meridional: 0.012
      turning_concentration: 1.6
    thickness:
      maximum_thickness_ratio: 0.16666667
      x_max_fraction: 0.45
      leading_edge_thickness_ratio: 0.04
      trailing_edge_thickness_ratio: 0.02
      shape_exponent: 4.0
      leading_edge_fraction: 0.08
      trailing_edge_fraction: 0.04
  flat_ends:
    title: Flat-ended constant-thickness blade
    camberline:
      coordinates: cartesian
      metal_angle_in_deg: 0.0
      metal_angle_out_deg: 0.0
      chord_meridional: 0.012
    thickness:
      maximum_thickness_ratio: 0.08333333
      leading_edge_thickness_ratio: 0.08333333
      trailing_edge_thickness_ratio: 0.08333333
      leading_edge_fraction: 0.0
      trailing_edge_fraction: 0.0
