chapters:
- start_seconds: 0.0
  end_seconds: 4.0
  title: Channel proportions
  group: dimensions
  field: axial_length
  baseline: 0.06
  target: 0.08
  label: Axial length
  units: mm
  note: Change the axial distance between the inlet and outlet stations.
  scale: 1000
- start_seconds: 4.0
  end_seconds: 8.0
  title: Outlet passage width
  group: dimensions
  field: outlet_width
  baseline: 0.008
  target: 0.014
  label: Outlet width
  units: mm
  note: The outlet radius stays fixed while the discharge passage opens.
  scale: 1000
- start_seconds: 8.0
  end_seconds: 12.0
  title: Inclined inlet
  group: dimensions
  field: inlet_flow_angle_deg
  baseline: 0
  target: 25
  label: Inlet inclination
  units: °
  note: The inlet station and inherited wall tangents rotate together.
  scale: 1.0
- start_seconds: 12.0
  end_seconds: 16.0
  title: Mixed-flow outlet
  group: dimensions
  field: outlet_flow_angle_deg
  baseline: 90
  target: 55
  label: Outlet inclination
  units: °
  note: Move continuously from a radial outlet towards mixed flow.
  scale: 1.0
- start_seconds: 16.0
  end_seconds: 20.0
  title: Independent hub slope
  group: hub
  field: inlet_angle_deg
  baseline: 0
  target: 20
  label: Hub inlet tangent
  units: °
  note: Only the hub wall changes; its inlet and outlet points stay fixed.
