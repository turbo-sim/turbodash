  units: ''
  note: Extend the influence of the outlet tangent without moving the endpoints.
  scale: 1.0
- start_seconds: 24.0
  end_seconds: 28.0
  title: Independent shroud bow
  group: shroud
  field: bow
  baseline: 0
  target: 0.05
  label: Shroud bow / chord
  units: ''
  note: Add normal displacement while preserving endpoint positions and slopes.
  scale: 1.0
- start_seconds: 28.0
  end_seconds: 32.0
  title: Blade leading-edge sweep
  group: blade
  field: leading_hub
  baseline: 0
  target: 0.27
  label: Hub leading-edge fraction
  units: ''
  note: Move the hub leading edge downstream; the channel walls do not change.
  scale: 1.0
- start_seconds: 32.0
  end_seconds: 36.0
  title: Bowed leading edge
  group: blade
  field: leading_bow
  baseline: 0
  target: 0.2
  label: Leading-edge bow
  units: ''
  note: Move the edge interior downstream while keeping both wall intersections fixed.
  scale: 1.0
- start_seconds: 36.0
  end_seconds: 40.0
  title: Independent blade cutback
  group: blade
  field: trailing_hub
  baseline: 1
  target: 0.8
  label: Hub trailing-edge fraction
  units: ''
  note: Trim the blade inside the existing channel without changing the casing.
  scale: 1.0
- start_seconds: 40.0
  end_seconds: 44.0
  title: Splitter placement
  group: splitter
  field: start_fraction
  baseline: 0.25
  target: 0.5
  label: Splitter start fraction
  units: ''
  note: Shorten the splitter from its inlet; its trailing edge stays with the main
    blade.
  scale: 1.0
notes:
- Every frame is evaluated and validated by the meridional geometry kernel.
- Blade edge and splitter fractions use the channel s coordinate, which is normalized
  wall arclength at hub and shroud.
- Geometric area excludes blade blockage and is not the blade-passage throat.
