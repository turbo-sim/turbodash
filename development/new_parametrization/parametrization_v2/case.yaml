# One editable blade case. All lengths are metres; metal angles are degrees.
# Both geometry blocks are retained so the app can switch blade type without
# losing the last dimensions entered. Only the selected block is evaluated.
blade_type: axial  # axial or radial

axial_geometry:
  meridional_chord: 0.010  # Axial inlet-to-outlet distance, positive.
  radius: 0.030           # Constant stream-surface radius, positive.

radial_geometry:
  inlet_radius: 0.020     # Radius at the inlet, positive.
  outlet_radius: 0.035    # Radius at the outlet, positive and different.
  # outlet_radius < inlet_radius selects radial inflow. Meridional distance
  # still increases from inlet to outlet, with positive chord |r_out-r_in|.

camberline:
  # Angles are measured from increasing meridional distance toward increasing
  # azimuth, including radial inflow. Their mathematical range is (-90, 90).
  inlet_metal_angle_deg: 0.0
  outlet_metal_angle_deg: 65.0
  # Interpolate angle itself, or its tangent (slope). Both preserve endpoints.
  interpolation: angle   # angle or slope
  # Station at half the total angle/slope change in NORMALIZED m', not m.
  # m' is obtained by integrating dm/r. Location must be strictly in (0, 1).
  turning_location: 0.5
  # Positive. Larger values concentrate turning around turning_location.
  # Value 1 with location 0.5 gives linear angle/slope versus normalized m'.
  turning_concentration: 1.0

thickness:
  # All thickness magnitudes are FULL thickness divided by meridional chord.
  # Denton's nominal maximum need not be the actual global maximum.
  maximum_thickness_ratio: 0.25
  # Nominal body station measured along m / meridional chord, strictly (0, 1).
  maximum_thickness_location: 0.30
  # Endpoint thicknesses of the UNROUNDED body, nonnegative. These are not
  # tip radii or the final thickness at a rounded, closed tip.
  leading_edge_thickness_ratio: 0.08
  trailing_edge_thickness_ratio: 0.02
  # Blend lengths / meridional chord, in [0, 1]. Zero disables rounding and
  # leaves a flat end if its body thickness is positive. Blends may overlap.
  leading_edge_fraction: 0.10
  trailing_edge_fraction: 0.025
  # Positive. 2 gives a parabolic hump in the transformed thickness coordinate;
  # larger values broaden its top. Values <= 1 can give a corner or cusp.
  shape_exponent: 2.0

cascade:
  # sigma = meridional chord / mean circumferential blade spacing.
  # The DEMO rounds the resulting blade count up to an integer, then passes
  # that count to the geometry module. No flow/loading inputs are needed.
  meridional_solidity: 1.2

numerics:
  # Cosine-spaced base stations; extra samples resolve edges and exact joins.
  number_of_points: 801

# Visible slider ranges, not aerodynamic feasibility constraints. Edit these
# to explore a wider interval; the geometry functions impose only mathematical
# domains. Initial values outside a display range expand it automatically.
# Open mathematical bounds (e.g. angle 90, zero radius) are excluded here.
slider_ranges:
  meridional_chord: [0.001, 0.050]
  radius: [0.001, 0.100]
  inlet_radius: [0.001, 0.100]
  outlet_radius: [0.001, 0.100]
  inlet_metal_angle_deg: [-89.9, 89.9]
  outlet_metal_angle_deg: [-89.9, 89.9]
  turning_location: [0.001, 0.999]
  turning_concentration: [0.05, 10.0]
  meridional_solidity: [0.05, 5.0]
  maximum_thickness_ratio: [0.001, 1.0]
  maximum_thickness_location: [0.001, 0.999]
  leading_edge_thickness_ratio: [0.0, 1.0]
  trailing_edge_thickness_ratio: [0.0, 1.0]
  leading_edge_fraction: [0.0, 1.0]
  trailing_edge_fraction: [0.0, 1.0]
  shape_exponent: [0.1, 12.0]
