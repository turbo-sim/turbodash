# Standalone radial inflow turbine design and optimization inputs.
# Geometry inputs use true-chord solidity c/s. Angles are in degrees.
inputs:
  loss_model: benner
  fluid_name: Air
  turbine_type: radial
  inlet_property_pair: PT_INPUTS
  inlet_property_1: 500000
  inlet_property_2: 600
  exit_pressure: 100000
  mass_flow_rate: 10
  inlet_flow_angle: 0
  blade_velocity_ratio: 0.6
  rotational_speed_type: specific  # specific: dimensionless Ns; actual: rpm.
  rotational_speed: 0.7

  stages:
    - name: stage_1
      work_fraction_split: 1
      stator_exit_angle: 70
      degree_reaction: 0.5
      meridional_velocity_ratio_12: 1
      meridional_velocity_ratio_23: 1
      meridional_velocity_ratio_34: 1
      radius_ratio_01: 1
      radius_ratio_12: 1.1
      radius_ratio_23: 1.05
      radius_ratio_34: 1.2
      blade_geometry:
        stator:
          aspect_ratio: 2
          maximum_thickness_to_chord: 0.3
          maximum_thickness_location: 0.3
          leading_edge_radius_to_max_thickness: 0.5
          trailing_edge_thickness_to_opening: 0.07
          trailing_edge_wedge_angle: 5
          leading_edge_wedge_angle: 30
          solidity_chord: 1.1209982569657782
        rotor:
          aspect_ratio: 2
          maximum_thickness_to_chord: 0.3
          maximum_thickness_location: 0.3
          leading_edge_radius_to_max_thickness: 0.5
          trailing_edge_thickness_to_opening: 0.07
          trailing_edge_wedge_angle: 5
          leading_edge_wedge_angle: 30
          solidity_chord: 1.216757241009723

optimization:
  # Paths address fields inside inputs; stages.0 is the first stage.
  # Removing or commenting out a variable leaves its input value fixed.
  # Without initial_value, its current value in inputs is the initial guess.
  design_variables:
    blade_velocity_ratio:
      lower_value: 0.5
      # initial_value: 0.58  # Optional override of inputs.blade_velocity_ratio.
      upper_value: 0.65
    rotational_speed:
      lower_value: 0.5
      upper_value: 0.95
    stages.0.degree_reaction:
      lower_value: 0.4
      upper_value: 0.6
    stages.0.stator_exit_angle:
      lower_value: 65
      upper_value: 75
    stages.0.meridional_velocity_ratio_12:
      lower_value: 0.3
      upper_value: 1.1
    stages.0.meridional_velocity_ratio_34:
      lower_value: 0.3
      upper_value: 1.1
    # stages.0.meridional_velocity_ratio_23:
    #   lower_value: 0.8
    #   upper_value: 1.2

    # Radius changes define radial row meridional chords; keep ratios above 1.
    stages.0.radius_ratio_12:
      lower_value: 1.05
      upper_value: 1.20
    stages.0.radius_ratio_34:
      lower_value: 1.10
      upper_value: 1.35

    # Radial aspect_ratio is derived from radius change and blade height.
    # Its input value above is retained for config compatibility, not varied.
    stages.0.blade_geometry.stator.solidity_chord:
      lower_value: 0.8
      upper_value: 1.6
    stages.0.blade_geometry.stator.trailing_edge_thickness_to_opening:
      lower_value: 0.04
      upper_value: 0.10
    # stages.0.blade_geometry.stator.maximum_thickness_to_chord:
    #   lower_value: 0.15
    #   upper_value: 0.35

    stages.0.blade_geometry.rotor.solidity_chord:
      lower_value: 0.8
      upper_value: 1.6
    stages.0.blade_geometry.rotor.trailing_edge_thickness_to_opening:
      lower_value: 0.04
      upper_value: 0.10
    # stages.0.blade_geometry.rotor.maximum_thickness_to_chord:
    #   lower_value: 0.15
    #   upper_value: 0.35

  objective_function:
    variable: $overall_performance.efficiency_ts
    type: maximize

  # Wildcards select every blade row in every stage. Each selected value
  # becomes its own constraint. Remove/add list entries for other studies.
  constraints:
    - variable: $stages_performance.*.geometry_meanline.*.flaring_angle
      type: '='
      value: 0
      normalize: 10
    # - variable: $overall_performance.maximum_mach_number
    #   type: '<='
    #   value: 1.4
    #   normalize: 1

  # Acceptance threshold for normalized residuals, separate from solver options.
  feasibility_tolerance: 1.0e-6
  solver_options:
    library: scipy
    method: slsqp
    derivative_method: 2-point
    derivative_abs_step: 1.0e-6
    tolerance: 1.0e-9
    max_iterations: 150
    print_convergence: true
    plot_convergence: false  # The runner plots and saves final convergence history.
    update_on: gradient
