[tool.poetry]
name = "turbodash-core"
version = "0.9.0"
description = "Interactive Dash app for turbomachinery stage preliminary design"
authors = ["Roberto Agromayor"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/turbo-sim/turbodash"
documentation = "https://github.com/turbo-sim/turbodash"
packages = [{ include = "turbodash" }]
include = [
    # Older app editions display the same canonical meanline note as Sphinx.
    { path = "docs/source/notes/documentation.md", format = ["sdist", "wheel"] },
]

[tool.poetry.scripts]
turbodash = "turbodash.apps.app_turbine.app:cli"
turbodash-experimental = "turbodash.apps.app_turbine_experimental.app:cli"

turbodash-optimization = "turbodash.apps.app_turbine_optimization.app:cli"
turbodash-stage = "turbodash.apps.app_stage.app:cli"

app_turbine = "turbodash.apps.app_turbine.app:cli"
app_turbine_experimental = "turbodash.apps.app_turbine_experimental.app:cli"
app_turbine_optimization = "turbodash.apps.app_turbine_optimization.app:cli"
app_stage = "turbodash.apps.app_stage.app:cli"
app_stage_efficiency = "turbodash.apps.app_stage_efficiency.app:cli"

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
gunicorn = "^22.0.0"
dash = "^3.2.0"
plotly = "^5.23.0"
numpy = "^2.3.0"
# PySolverView's controlled SLSQP bridge requires this SciPy interface.
scipy = "1.17.1"
matplotlib = "^3.10.6"
jaxprop = "^0.5.8"
python-docx = "^1.2.0"
xlwings = "0.34.0"
dash-bootstrap-components = "^2.0.4"
# NLP backends used by the workbench optimizer selector and development studies.
pysolver-view = { version = "^0.8.1", extras = ["pounce"] }
# Use a published version so the optional mesh extra is accepted by PyPI.
turbo_moc = { version = "1.2.0", optional = true }

[tool.poetry.extras]
mesh = ["turbo_moc"]

[tool.poetry.group.dev.dependencies]
ipython = ">=8.13,<8.17"
toml = "^0.10.2"
black = "^26.3.1"
pytest = "^8.3.5"
pyzotero = "^1.5.19"
numpydoc = "^1.7.0"
sphinx = "^7.3.7"
sphinx-tabs = "^3.4.5"
sphinx-book-theme = "^1.1.2"
sphinx-rtd-theme = "^2.0.0"
sphinxcontrib-bibtex = "^2.6.2"
sphinxawesome-theme = "^5.1.5"
sphinx-design = "^0.6.0"
sphinx-togglebutton = "^0.3.2"
bump-my-version = "^1.5.1"
sphinx-autobuild = "^2024.10.3"
myst-parser = "^4.0.1"
linkify-it-py = ">=2,<3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


# Version bumping and releasing (run from the repository root):
# 1. Install development tools: poetry install --with dev
# 2. Commit your changes first; bumping requires a clean working tree.
# 3. Preview a bump: poetry run bump-my-version bump --dry-run --verbose patch
# 4. Choose ONE increment (updates version files, commits, and creates a vX.Y.Z tag):
#    poetry run bump-my-version bump patch
#    poetry run bump-my-version bump minor
#    poetry run bump-my-version bump major
# 5. Release from main: git push origin main --follow-tags
#    GitHub Actions builds the distributions and publishes the pushed release tag.
# Publishing uses the existing repository secrets PYPI_PASSWORD (PyPI API token)
# and PYPI_USERNAME (normally __token__; defaults to it if the secret is absent).
# A future switch to OIDC requires first registering a matching PyPI Trusted
# Publisher: owner=turbo-sim, repository=turbodash,
# workflow=publish_to_pypi.yaml, environment=pypi.
